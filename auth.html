<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090c10; }</style>
</head>
<body class="text-slate-100 antialiased flex items-center justify-center min-h-screen p-6">
    <div class="bg-[#111622] border border-amber-500/20 rounded-3xl p-10 max-w-md w-full shadow-2xl relative">
        <div class="text-center mb-8">
            <span class="inline-block text-3xl font-extrabold text-white tracking-tight">Velo<span class="text-amber-500">Client</span></span>
            <p class="text-xs text-slate-400 mt-2">Secure Enterprise Client Portal</p>
        </div>

        <form onsubmit="handleSecureAuth(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Corporate Email</label>
                <input type="email" id="email-input" placeholder="name@enterprise.com" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500 font-medium" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Personal Secure Password</label>
                <input type="password" id="password-input" placeholder="At least 6 characters" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full mt-4 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-amber-900/30 text-sm tracking-wide cursor-pointer">
                Sign In / Register Securely
            </button>
        </form>

        <p class="text-center text-[11px] text-slate-500 mt-6">
            Secured by Supabase Database &bull; <a href="mailto:anikmanna697@gmail.com" class="text-amber-400 hover:underline">Support</a>
        </p>
    </div>

    <script>
        // Your real Supabase Project Credentials
        const SUPABASE_URL = 'https://fjtutrvsoohxvpnqfhgu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqdHV0cnZzb29oeHZwbnFmaGd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3Mzk2MDksImV4cCI6MjA4NjMxNTYwOX0.YOUR_FULL_KEY_HERE'; // Keep your full anon key here
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleSecureAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if (password.length < 6) {
                alert("For security, your personalized password must be at least 6 characters long.");
                return;
            }

            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifying Credentials...`;
            submitBtn.disabled = true;

            try {
                // Step 1: Try signing in with the provided email and password
                let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                
                // Step 2: If sign in fails because the account doesn't exist yet, register them automatically
                if (error) {
                    let signUpRes = await supabaseClient.auth.signUp({ email, password });
                    if (signUpRes.error) {
                        // If signup fails because user exists, it means they typed the wrong password
                        throw new Error("Incorrect password entered for this email address. Please try again.");
                    }
                }

                // Step 3: Success! Proceed in proper sequence to index.html with the secure email session
                window.location.href = `index.html?email=${encodeURIComponent(email)}`;
            } catch (err) {
                alert("Security Authentication Error: " + err.message);
                submitBtn.innerHTML = `Sign In / Register Securely`;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
