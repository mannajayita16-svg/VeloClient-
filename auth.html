<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white antialiased flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-2xl font-extrabold text-white">Velo<span class="text-slate-400">Client</span></span>
            <p class="text-xs text-slate-400 mt-2">Access your agency workspace or create an account</p>
        </div>

        <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-950 rounded-2xl mb-6 border border-slate-800 text-xs font-semibold">
            <button onclick="switchTab('signin')" id="tab-signin" class="bg-slate-800 text-white py-2.5 rounded-xl transition border border-slate-700">Sign In</button>
            <button onclick="switchTab('signup')" id="tab-signup" class="text-slate-400 py-2.5 rounded-xl transition">Create Account</button>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html?demo=true';" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
                <input type="email" placeholder="name@agency.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-slate-600" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                <input type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-slate-600" required>
            </div>
            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3.5 rounded-xl transition border border-slate-700 text-sm">Continue to Dashboard</button>
        </form>
    </div>

    <script>
        function switchTab(mode) {
            if(mode === 'signin') {
                document.getElementById('tab-signin').className = "bg-slate-800 text-white py-2.5 rounded-xl transition border border-slate-700";
                document.getElementById('tab-signup').className = "text-slate-400 py-2.5 rounded-xl transition";
            } else {
                document.getElementById('tab-signup').className = "bg-slate-800 text-white py-2.5 rounded-xl transition border border-slate-700";
                document.getElementById('tab-signin').className = "text-slate-400 py-2.5 rounded-xl transition";
            }
        }
    </script>
</body>
</html>
