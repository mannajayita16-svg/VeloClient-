<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090c10; }</style>
</head>
<body class="text-slate-100 antialiased flex items-center justify-center min-h-screen p-6 relative">
    
    <!-- Sign In Card -->
    <div class="bg-[#111622] border border-amber-500/20 rounded-3xl p-10 max-w-md w-full shadow-2xl relative overflow-hidden">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block text-3xl font-extrabold text-white tracking-tight">Velo<span class="text-amber-500">Client</span></a>
            <p class="text-xs text-slate-400 mt-2">Secure Enterprise Client & Agency Portal</p>
        </div>

        <!-- SSO Sign-In Buttons -->
        <div class="space-y-3 mb-6">
            <button type="button" onclick="openAuthModal('Google')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md cursor-pointer">
                <i class="fa-brands fa-google text-amber-400 text-sm"></i> Sign in with Google
            </button>
            <button type="button" onclick="openAuthModal('Apple')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md cursor-pointer">
                <i class="fa-brands fa-apple text-white text-sm"></i> Sign in with Apple
            </button>
            <button type="button" onclick="openAuthModal('LinkedIn')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md cursor-pointer">
                <i class="fa-brands fa-linkedin text-blue-400 text-sm"></i> Sign in with LinkedIn
            </button>
            <button type="button" onclick="openAuthModal('Twitter')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md cursor-pointer">
                <i class="fa-brands fa-x-twitter text-slate-200 text-sm"></i> Sign in with X (Twitter)
            </button>
        </div>

        <div class="relative flex py-2 items-center mb-6">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-[10px] uppercase tracking-widest font-semibold">or corporate email</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- Email Form -->
        <form id="signin-form" onsubmit="handleEmailLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Corporate Email</label>
                <input type="email" id="email-input" placeholder="name@enterprise.com" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500 font-medium" required>
            </div>
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-semibold text-slate-400">Password</label>
                    <a href="#" onclick="alert('Password reset link sent to your corporate email.'); return false;" class="text-[10px] text-amber-400 hover:underline">Forgot password?</a>
                </div>
                <input type="password" id="password-input" placeholder="••••••••••••" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full mt-2 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-amber-900/30 text-sm tracking-wide cursor-pointer">
                Sign In to Workspace
            </button>
        </form>

        <p class="text-center text-[11px] text-slate-500 mt-6">
            Protected by bank-grade encryption &bull; <a href="mailto:anikmanna697@gmail.com" class="text-amber-400 hover:underline">Support</a>
        </p>
    </div>

    <!-- True Interactive Authentication Authorization Popup Modal -->
    <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#111622] border border-slate-700 rounded-3xl p-8 max-w-sm w-full shadow-2xl space-y-6 text-center animate-in fade-in zoom-in duration-200">
            <div id="modal-content" class="space-y-4">
                <!-- Dynamically populated provider verification screen -->
            </div>
        </div>
    </div>

    <script>
        function openAuthModal(provider) {
            const modal = document.getElementById('auth-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let iconClass = "fa-brands fa-google text-blue-500";
            let brandColor = "text-amber-400";
            if(provider === 'Apple') { iconClass = "fa-brands fa-apple text-white"; }
            else if(provider === 'LinkedIn') { iconClass = "fa-brands fa-linkedin text-blue-400"; }
            else if(provider === 'Twitter') { iconClass = "fa-brands fa-x-twitter text-slate-200"; }

            content.innerHTML = `
                <div class="flex flex-col items-center gap-2">
                    <div class="w-12 h-12 rounded-full bg-[#161d2d] border border-slate-700 flex items-center justify-center text-xl shadow-md">
                        <i class="${iconClass}"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mt-1">Sign in with ${provider}</h3>
                    <p class="text-xs text-slate-400">VeloClient requests permission to verify your corporate account.</p>
                </div>

                <div class="bg-[#161d2d] border border-slate-700 rounded-2xl p-4 text-left space-y-2">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-amber-600 text-white font-bold flex items-center justify-center text-xs">AM</div>
                        <div class="overflow-hidden">
                            <p class="text-xs font-bold text-white">Anik Manna</p>
                            <p class="text-[10px] text-slate-400 truncate">anikmanna697@gmail.com</p>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button onclick="closeAuthModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold py-3 rounded-xl transition">Cancel</button>
                    <button onclick="confirmAuth('${provider}')" class="w-1/2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-md">Authorize</button>
                </div>
            `;
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function confirmAuth(provider) {
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="py-8 space-y-4 text-center">
                    <i class="fa-solid fa-spinner fa-spin text-amber-400 text-3xl"></i>
                    <p class="text-sm font-bold text-white">Authenticating via ${provider} OAuth...</p>
                    <p class="text-xs text-slate-400">Establishing secure session handshake</p>
                </div>
            `;

            setTimeout(() => {
                window.location.href = `dashboard.html?demo=true&auth=${provider.toLowerCase()}`;
            }, 1200);
        }

        function handleEmailLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if(email && password) {
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifying Corporate Credentials...`;
                submitBtn.disabled = true;

                setTimeout(() => {
                    submitBtn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> Success! Opening Dashboard...`;
                    setTimeout(() => {
                        window.location.href = `dashboard.html?demo=true&email=${encodeURIComponent(email)}`;
                    }, 600);
                }, 1000);
            }
        }
    </script>
</body>
</html>
