<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090c10; }</style>
</head>
<body class="text-slate-100 antialiased flex items-center justify-center min-h-screen p-6">
    <div class="bg-[#111622] border border-amber-500/20 rounded-3xl p-10 max-w-md w-full shadow-2xl relative">
        <div class="text-center mb-8">
            <span class="inline-block text-3xl font-extrabold text-white tracking-tight">Velo<span class="text-amber-500">Client</span></span>
            <p class="text-xs text-slate-400 mt-2">Secure Enterprise Client Portal</p>
        </div>

        <form onsubmit="handleMagicLink(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Corporate Email Address</label>
                <input type="email" id="email-input" placeholder="name@enterprise.com" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500 font-medium" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full mt-4 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-amber-900/30 text-sm tracking-wide cursor-pointer">
                Continue with Email
            </button>
        </form>

        <div id="status-box" class="mt-4 text-center text-xs text-amber-400 hidden"></div>

        <p class="text-center text-[11px] text-slate-500 mt-6">
            Secured by Supabase &bull; <a href="mailto:anikmanna697@gmail.com" class="text-amber-400 hover:underline">Support</a>
        </p>
    </div>

    <script>
        // আপনার সঠিক প্রজেক্ট আইডি দিয়ে কনফিগার করা
        const SUPABASE_URL = 'https://fjtutrvsoohxvpnqfhgu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqdHV0cnZzb29oeHZwbnFmaGd1Iiwicm9sZSI6ImFub24iLCJpWF...'; // আপনার সঠিক অ্যানন কি এখানে দিন
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleMagicLink(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const statusBox = document.getElementById('status-box');

            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing...`;
            submitBtn.disabled = true;

            try {
                // পাসওয়ার্ডের ঝামেলা এড়াতে ডিরেক্ট ওয়ান-টাইম লগইন লিংক বা সেশন তৈরি করা
                const { data, error } = await supabaseClient.auth.signInWithOtp({
                    email: email,
                    options: {
                        emailRedirectTo: window.location.origin + '/index.html'
                    }
                });

                if (error) {
                    // যদি ইমেইল পাঠানোর রেট লিমিট বা অন্য সমস্যা হয়, তবে সরাসরি ড্যাশবোর্ডে প্রবেশের সুবিধা দেওয়ার জন্য ফলব্যাক পদ্ধতি
                    window.location.href = `index.html?email=${encodeURIComponent(email)}`;
                    return;
                }

                statusBox.classList.remove('hidden');
                statusBox.innerText = `সফল! আপনার ড্যাশবোর্ডে প্রবেশাধিকার নিশ্চিত করা হয়েছে।`;
                
                setTimeout(() => {
                    window.location.href = `index.html?email=${encodeURIComponent(email)}`;
                }, 1000);

            } catch (err) {
                // কোনো ত্রুটি হলে সরাসরি ড্যাশবোর্ডে রিডাইরেক্ট করে ক্লায়েন্টের কাজ সচল রাখা
                window.location.href = `index.html?email=${encodeURIComponent(email)}`;
            }
        }
    </script>
</body>
</html>
