<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090c10; }</style>
</head>
<body class="text-slate-100 antialiased flex items-center justify-center min-h-screen p-6 relative">
    
    <div class="bg-[#111622] border border-amber-500/20 rounded-3xl p-10 max-w-md w-full shadow-2xl relative overflow-hidden">
        <div class="text-center mb-8">
            <span class="inline-block text-3xl font-extrabold text-white tracking-tight">Velo<span class="text-amber-500">Client</span></span>
            <p class="text-xs text-slate-400 mt-2">Secure Enterprise Client & Agency Portal</p>
        </div>

        <!-- SSO Sign-In Buttons -->
        <div class="space-y-3 mb-6">
            <button type="button" onclick="openMultiAccountModal('Google')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md cursor-pointer">
                <i class="fa-brands fa-google text-amber-400 text-sm"></i> Sign in with Google
            </button>
            <button type="button" onclick="openMultiAccountModal('Apple')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md cursor-pointer">
                <i class="fa-brands fa-apple text-white text-sm"></i> Sign in with Apple
            </button>
            <button type="button" onclick="openMultiAccountModal('LinkedIn')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md cursor-pointer">
                <i class="fa-brands fa-linkedin text-blue-400 text-sm"></i> Sign in with LinkedIn
            </button>
            <button type="button" onclick="openMultiAccountModal('Twitter')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md cursor-pointer">
                <i class="fa-brands fa-x-twitter text-slate-200 text-sm"></i> Sign in with X (Twitter)
            </button>
        </div>

        <div class="relative flex py-2 items-center mb-6">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-[10px] uppercase tracking-widest font-semibold">or corporate email</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <form id="signin-form" onsubmit="handleEmailLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Corporate Email</label>
                <input type="email" id="email-input" placeholder="name@enterprise.com" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500 font-medium" required>
            </div>
            <div>
                <input type="password" id="password-input" placeholder="Password" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full mt-2 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-amber-900/30 text-sm tracking-wide cursor-pointer">
                Sign In to Workspace
            </button>
        </form>
    </div>

    <!-- Multi-Account Selection Modal -->
    <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#111622] border border-slate-700 rounded-3xl p-8 max-w-sm w-full shadow-2xl space-y-6 text-center">
            <div id="modal-content" class="space-y-4">
                <!-- Dynamically populated multi-account list -->
            </div>
        </div>
    </div>

    <script>
        const accountsList = [
            { name: "Anik Manna", email: "anikmanna697@gmail.com", initials: "AM", color: "bg-amber-600" },
            { name: "Jayita Kole", email: "jayita5628@gmail.com", initials: "JK", color: "bg-blue-600" },
            { name: "Corporate Executive", email: "director@enterprise-corp.com", initials: "CE", color: "bg-emerald-600" },
            { name: "Development Lead", email: "dev@veloclient.io", initials: "DL", color: "bg-indigo-600" }
        ];

        function openMultiAccountModal(provider) {
            const modal = document.getElementById('auth-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            let html = `
                <div class="flex flex-col items-center gap-2">
                    <h3 class="text-base font-bold text-white">Choose an account</h3>
                    <p class="text-xs text-slate-400">to continue to VeloClient via ${provider}</p>
                </div>
                <div class="space-y-2 text-left max-h-60 overflow-y-auto pr-1">
            `;

            accountsList.forEach(acc => {
                html += `
                    <div onclick="selectAndAuthorize('${provider}', '${acc.name}', '${acc.email}')" class="flex items-center gap-3 p-3 rounded-2xl bg-[#161d2d] hover:bg-[#1f293d] border border-slate-700 cursor-pointer transition">
                        <div class="w-8 h-8 rounded-full ${acc.color} text-white font-bold flex items-center justify-center text-xs">${acc.initials}</div>
                        <div class="overflow-hidden">
                            <p class="text-xs font-bold text-white">${acc.name}</p>
                            <p class="text-[10px] text-slate-400 truncate">${acc.email}</p>
                        </div>
                    </div>
                `;
            });

            html += `
                </div>
                <button onclick="closeAuthModal()" class="text-xs text-slate-400 hover:text-white transition pt-2">Cancel</button>
            `;
            content.innerHTML = html;
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function selectAndAuthorize(provider, name, email) {
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="py-8 space-y-4 text-center">
                    <i class="fa-solid fa-spinner fa-spin text-amber-400 text-3xl"></i>
                    <p class="text-sm font-bold text-white">Authorizing ${name} (${email})...</p>
                    <p class="text-xs text-slate-400">Secure handshake with ${provider} SSO</p>
                </div>
            `;

            setTimeout(() => {
                // Sequence rule: After successful sign-in, redirect to index.html (Home Landing Page)
                window.location.href = `index.html?user=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
            }, 1200);
        }

        function handleEmailLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if(email) {
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...`;
                submitBtn.disabled = true;

                setTimeout(() => {
                    window.location.href = `index.html?email=${encodeURIComponent(email)}`;
                }, 1000);
            }
        }
    </script>
</body>
</html>
