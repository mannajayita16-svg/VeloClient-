<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090c10; }</style>
</head>
<body class="text-slate-100 antialiased flex items-center justify-center min-h-screen p-6">
    <div class="bg-[#111622] border border-slate-800 rounded-3xl p-10 max-w-md w-full shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-3xl font-extrabold text-white">Velo<span class="text-amber-500">Client</span></span>
            <p class="text-xs text-slate-400 mt-2">Enterprise Client & Agency Portal</p>
        </div>

        <button onclick="window.location.href='dashboard.html?demo=true';" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-bold py-3.5 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs mb-6 shadow-md">
            <i class="fa-brands fa-google text-amber-400 text-sm"></i> Continue with Google
        </button>

        <div class="relative flex py-2 items-center mb-6">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-[10px] uppercase tracking-widest">or email</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html?demo=true';" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
                <input type="email" placeholder="name@agency.com" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                <input type="password" placeholder="••••••••" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500" required>
            </div>
            <button type="submit" class="w-full mt-2 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-amber-900/30 text-sm">Sign In to Workspace</button>
        </form>
    </div>
</body>
</html>
