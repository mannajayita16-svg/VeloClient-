<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090c10; }</style>
</head>
<body class="text-slate-100 antialiased flex items-center justify-center min-h-screen p-6">
    <div class="bg-[#111622] border border-amber-500/20 rounded-3xl p-10 max-w-md w-full shadow-2xl relative">
        <div class="text-center mb-8">
            <span class="inline-block text-3xl font-extrabold text-white tracking-tight">Velo<span class="text-amber-500">Client</span></span>
            <p class="text-xs text-slate-400 mt-2">Secure Enterprise Client Portal</p>
        </div>

        <form onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Corporate Email</label>
                <input type="email" id="email-input" placeholder="name@enterprise.com" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500 font-medium" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Create / Enter Your Password</label>
                <input type="password" id="password-input" placeholder="At least 6 characters" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full mt-4 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-amber-900/30 text-sm tracking-wide cursor-pointer">
                Sign In / Register
            </button>
        </form>

        <p class="text-center text-[11px] text-slate-500 mt-6">
            Secured by Supabase Database &bull; <a href="mailto:anikmanna697@gmail.com" class="text-amber-400 hover:underline">Support</a>
        </p>
    </div>

    <script>
        // REPLACE THESE WITH YOUR REAL SUPABASE URL AND PUBLISHABLE KEY FROM YOUR DASHBOARD API SETTINGS
        const SUPABASE_URL = 'https://fjtutrvsoohxvpnqfhgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_al-XL6fXqnQwYDI3H5_5Mg_umQC6orn';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if (password.length < 6) {
                alert("For security, your password must be at least 6 characters long.");
                return;
            }

            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...`;
            submitBtn.disabled = true;

            try {
                // First try to sign in with the password they provided
                let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                
                // If account doesn't exist yet, automatically register them with this password
                if (error) {
                    const signUpRes = await supabaseClient.auth.signUp({ email, password });
                    if (signUpRes.error) throw signUpRes.error;
                }

                // Successful login -> Proceed to index.html in sequence
                window.location.href = 'index.html';
            } catch (err) {
                alert("Authentication error: " + err.message + "\n\n(Tip: Make sure you updated SUPABASE_URL and SUPABASE_ANON_KEY with your real keys!)");
                submitBtn.innerHTML = `Sign In / Register`;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
