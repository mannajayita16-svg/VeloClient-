<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090c10; }</style>
</head>
<body class="text-slate-100 antialiased flex items-center justify-center min-h-screen p-6">
    <div class="bg-[#111622] border border-amber-500/20 rounded-3xl p-10 max-w-md w-full shadow-2xl relative">
        <div class="text-center mb-8">
            <span class="inline-block text-3xl font-extrabold text-white tracking-tight">Velo<span class="text-amber-500">Client</span></span>
            <p class="text-xs text-slate-400 mt-2">Secure Enterprise Client Portal</p>
        </div>

        <!-- Toggle Tabs -->
        <div class="flex bg-[#090c10] p-1 rounded-2xl mb-6 border border-slate-800">
            <button id="tab-signin" onclick="switchMode('signin')" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-amber-600 text-white transition cursor-pointer">Sign In</button>
            <button id="tab-register" onclick="switchMode('register')" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition cursor-pointer">Register</button>
        </div>

        <form id="auth-form" onsubmit="handleAuthAction(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Corporate Email</label>
                <input type="email" id="email-input" placeholder="name@enterprise.com" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500 font-medium" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5" id="password-label">Secure Password</label>
                <input type="password" id="password-input" placeholder="At least 6 characters" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full mt-4 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-amber-900/30 text-sm tracking-wide cursor-pointer">
                Sign In to Workspace
            </button>
        </form>

        <p class="text-center text-[11px] text-slate-500 mt-6">
            Secured by Supabase Database &bull; <a href="mailto:anikmanna697@gmail.com" class="text-amber-400 hover:underline">Support</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://fjtutrvsoohxvpnqfhgu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqdHV0cnZzb29oeHZwbnFmaGd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA3Mzk2MDksImV4cCI6MjA4NjMxNTYwOX0.YOUR_FULL_KEY_HERE'; // Keep your full key here
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentMode = 'signin';

        function switchMode(mode) {
            currentMode = mode;
            const signinTab = document.getElementById('tab-signin');
            const registerTab = document.getElementById('tab-register');
            const submitBtn = document.getElementById('submit-btn');

            if (mode === 'signin') {
                signinTab.className = "flex-1 py-2.5 text-xs font-bold rounded-xl bg-amber-600 text-white transition cursor-pointer";
                registerTab.className = "flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition cursor-pointer";
                submitBtn.innerText = "Sign In to Workspace";
            } else {
                registerTab.className = "flex-1 py-2.5 text-xs font-bold rounded-xl bg-amber-600 text-white transition cursor-pointer";
                signinTab.className = "flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition cursor-pointer";
                submitBtn.innerText = "Create New Account";
            }
        }

        async function handleAuthAction(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if (password.length < 6) {
                alert("For security, your password must be at least 6 characters long.");
                return;
            }

            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing...`;
            submitBtn.disabled = true;

            try {
                if (currentMode === 'signin') {
                    // Strictly Sign In
                    let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw new Error("Invalid email or password. Please check your details.");
                } else {
                    // Strictly Register
                    let { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    alert("Account created successfully!");
                }

                // Sequence step: Redirect to index.html with active session
                window.location.href = `index.html?email=${encodeURIComponent(email)}`;
            } catch (err) {
                alert("Error: " + err.message);
                submitBtn.innerHTML = currentMode === 'signin' ? "Sign In to Workspace" : "Create New Account";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
