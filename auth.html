<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090c10; }</style>
</head>
<body class="text-slate-100 antialiased flex items-center justify-center min-h-screen p-6">
    <div class="bg-[#111622] border border-amber-500/20 rounded-3xl p-10 max-w-md w-full shadow-2xl relative overflow-hidden">
        <!-- Top Branding Header -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block text-3xl font-extrabold text-white tracking-tight">Velo<span class="text-amber-500">Client</span></a>
            <p class="text-xs text-slate-400 mt-2">Secure Enterprise Client & Agency Portal</p>
        </div>

        <!-- Working SSO Sign-In Buttons -->
        <div class="space-y-3 mb-6" id="sso-container">
            <button type="button" onclick="handleGoogleLogin()" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md">
                <i class="fa-brands fa-google text-amber-400 text-sm"></i> Sign in with Google
            </button>
            <button type="button" onclick="handleSSOLogin('Apple')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md">
                <i class="fa-brands fa-apple text-white text-sm"></i> Sign in with Apple
            </button>
            <button type="button" onclick="handleSSOLogin('LinkedIn')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md">
                <i class="fa-brands fa-linkedin text-blue-400 text-sm"></i> Sign in with LinkedIn
            </button>
            <button type="button" onclick="handleSSOLogin('Twitter')" class="w-full bg-[#161d2d] hover:bg-[#1a2336] text-white font-semibold py-3.5 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center gap-3 text-xs shadow-md">
                <i class="fa-brands fa-x-twitter text-slate-200 text-sm"></i> Sign in with X (Twitter)
            </button>
        </div>

        <div class="relative flex py-2 items-center mb-6">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="flex-shrink mx-4 text-slate-500 text-[10px] uppercase tracking-widest font-semibold">or corporate email</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- Working Email Form -->
        <form id="signin-form" onsubmit="handleEmailLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Corporate Email</label>
                <input type="email" id="email-input" placeholder="name@enterprise.com" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500 font-medium" required>
            </div>
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-semibold text-slate-400">Password</label>
                    <a href="#" onclick="alert('Password reset link sent to your corporate email.'); return false;" class="text-[10px] text-amber-400 hover:underline">Forgot password?</a>
                </div>
                <input type="password" id="password-input" placeholder="••••••••••••" class="w-full bg-[#090c10] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500" required>
            </div>
            <button type="submit" id="submit-btn" class="w-full mt-2 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-amber-900/30 text-sm tracking-wide">
                Sign In to Workspace
            </button>
        </form>

        <p class="text-center text-[11px] text-slate-500 mt-6">
            Protected by bank-grade encryption &bull; <a href="mailto:anikmanna697@gmail.com" class="text-amber-400 hover:underline">Support</a>
        </p>
    </div>

    <script>
        function handleGoogleLogin() {
            // Simulates true Google OAuth popup authentication flow
            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-400 mr-2"></i> Connecting to Google Account...`;
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400 mr-2"></i> Google Authenticated! Redirecting...`;
                setTimeout(() => {
                    window.location.href = 'dashboard.html?demo=true';
                }, 600);
            }, 1200);
        }

        function handleSSOLogin(provider) {
            const btn = event.currentTarget;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-400 mr-2"></i> Authenticating with ${provider}...`;
            btn.disabled = true;

            setTimeout(() => {
                window.location.href = 'dashboard.html?demo=true';
            }, 1000);
        }

        function handleEmailLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if(email && password) {
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifying Credentials...`;
                submitBtn.disabled = true;

                setTimeout(() => {
                    submitBtn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> Success! Opening Dashboard...`;
                    setTimeout(() => {
                        window.location.href = 'dashboard.html?demo=true';
                    }, 600);
                }, 1000);
            }
        }
    </script>
</body>
    </html>
