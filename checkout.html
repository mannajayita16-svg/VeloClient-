<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white antialiased">
    <nav class="border-b border-slate-800 bg-slate-950">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <span class="text-xl font-extrabold tracking-tight text-white">Velo<span class="text-slate-400">Client</span></span>
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-300">
                <i class="fa-solid fa-lock text-emerald-400"></i> Secure Checkout
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <a href="pricing.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-white mb-8 transition"><i class="fa-solid fa-arrow-left text-xs"></i> Back to Pricing</a>
        
        <div class="grid lg:grid-cols-2 gap-8 items-start">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8">
                <h3 class="text-xl font-bold text-white mb-6">Order Summary</h3>
                <div class="flex items-start justify-between pb-6 border-b border-slate-800 mb-6">
                    <div>
                        <h4 class="font-bold text-lg text-white">VeloClient Pro</h4>
                        <p class="text-xs text-slate-400">Lifetime access to all features</p>
                    </div>
                    <div class="text-right">
                        <p class="text-2xl font-black text-white">$10,000</p>
                    </div>
                </div>
                <div class="space-y-3 text-xs text-slate-400">
                    <p>PayPal Billing: <strong class="text-slate-200">jayita5628@gmail.com</strong></p>
                    <p>Support: <strong class="text-slate-200">anikmanna697@gmail.com</strong></p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8">
                <h3 class="text-xl font-bold text-white mb-6">Payment Method</h3>
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <a href="https://www.paypal.com/ncp/payment/YOUR_PAYPAL_ID" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold border border-slate-700">
                        <i class="fa-brands fa-paypal"></i> PayPal
                    </a>
                    <button onclick="alert('Payment successful!');" class="bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl flex items-center justify-center gap-2 text-xs font-semibold border border-slate-700">
                        <i class="fa-solid fa-credit-card"></i> Card
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
