<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - VeloClient</title>
    <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/bolt.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#0f172a] text-slate-100 antialiased">
    <!-- Navbar -->
    <nav class="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto border-b border-slate-800">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-2 rounded-lg text-white font-bold"><i class="fa-solid fa-bolt text-sm"></i></div>
            <span class="text-lg font-bold tracking-tight text-white">Velo<span class="text-blue-400 font-normal">Client</span></span>
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-400">
            <i class="fa-solid fa-lock text-emerald-400"></i> Secure Checkout
        </div>
    </nav>

    <!-- Checkout Main Content -->
    <main class="max-w-5xl mx-auto px-6 py-10">
        <a href="pricing.html" class="inline-flex items-center gap-2 text-sm text-slate-400 hover:text-white mb-6 transition"><i class="fa-solid fa-arrow-left text-xs"></i> Back to Pricing</a>
        
        <div class="grid md:grid-cols-2 gap-8 items-start">
            <!-- Order Summary Column -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h3 class="text-lg font-bold text-white mb-6">Order Summary</h3>
                <div class="flex items-start justify-between pb-6 border-b border-slate-800 mb-6">
                    <div>
                        <h4 class="font-bold text-base text-white">VeloClient Pro (Lifetime)</h4>
                        <p class="text-xs text-slate-400">Full access to all features</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-bold text-white">$10,000</p>
                    </div>
                </div>
                <div class="space-y-3 text-xs text-slate-400">
                    <p>PayPal Billing Account: <strong class="text-slate-200">jayita5628@gmail.com</strong></p>
                    <p>Support Contact: <strong class="text-slate-200">anikmanna697@gmail.com</strong></p>
                    <div class="flex items-center gap-2 pt-2"><i class="fa-solid fa-shield-halved text-blue-400"></i> SSL Encrypted Payment Processing</div>
                </div>
            </div>

            <!-- Payment Form Column -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h3 class="text-lg font-bold text-white mb-6">Payment Method</h3>
                
                <div class="grid grid-cols-2 gap-2 mb-6">
                    <a href="https://www.paypal.com/ncp/payment/YOUR_PAYPAL_ID" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-lg flex items-center justify-center gap-2 text-xs font-semibold transition">
                        <i class="fa-brands fa-paypal text-sm"></i> PayPal (jayita5628@gmail.com)
                    </a>
                    <button onclick="alert('Card payment simulated successfully.');" class="bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-lg flex items-center justify-center gap-2 text-xs font-semibold transition border border-slate-700">
                        <i class="fa-solid fa-credit-card text-sm"></i> Credit Card
                    </button>
                </div>

                <form onsubmit="event.preventDefault();" class="space-y-4 pt-2 border-t border-slate-800">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Card Number</label>
                        <input type="text" placeholder="4242 4242 4242 4242" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500 font-mono" required>
                    </div>
                    <button type="submit" onclick="alert('Payment completed successfully.');" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg transition text-sm">
                        Pay $10,000
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
    </html>
